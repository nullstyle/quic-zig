[tools]
# Zig 0.17 is unreleased, so we track master — but we PIN an exact master
# build rather than resolving `master` at install time. `zig = "master"`
# made CI non-reproducible: every job silently got whatever master was
# published that morning, which is not the compiler any release was
# verified against, and a Zig-side behaviour change then looked like a
# flake in our own code.
#
# That is not hypothetical. The blocking `rc-fuzz` gate failed for two
# weeks with "corrupted coverage file ... pcs_len was zero" because CI had
# drifted to 0.17.0-dev.1282+c0f9b51d8, where `--fuzz` no longer
# instruments the root module on its own. On the pinned build below the
# identical 1M-budget run (37.1M executions) completes clean with real
# coverage — verified on both aarch64-linux and aarch64-macos.
#
# To move: bump this, re-verify (full test suite + examples + echo smoke +
# consumer smoke + a deep fuzz run), then update the floor in
# build.zig.zon `minimum_zig_version` (currently 0.17.0-dev.1683) and the
# "Verified toolchain" line in the CHANGELOG entry together.
zig = "0.17.0-dev.1683+5ceec001b"
just = "1.49.0"
python = "3.12.13"
uv = "0.11.3"

[env]
ZIG_GLOBAL_CACHE_DIR = "{{config_root}}/.zig-global-cache"

[tasks.test]
description = "Run the quic-zig Zig test suite"
run = "zig build test"

[tasks.fuzz]
# Deep coverage-guided fuzzing on the unfiltered test binary — a *filtered*
# test binary under --fuzz still aborts the build-runner (ziglang/zig#25352),
# so there are deliberately no per-site steps. Single-instance
# (n_instances = 1), so it saturates one core and rotates across sites.
# Matches CI (.github/workflows/fuzz.yml) in command and budget: 1M/target
# ~= 37M executions ~= 5 h. Works on macOS as of the pinned 0.17.0-dev.1252
# (the dev.1158 macOS abort is fixed; see CONTRIBUTING.md "Fuzzing"), but
# prefer Linux for long runs since that is what CI exercises.
description = "Deep coverage-guided fuzzing (single-instance, unfiltered)"
run = "zig build test -Duse-llvm=true --fuzz=1M"

[tasks.qns-endpoint]
description = "Build the QNS endpoint binary"
run = "zig build qns-endpoint"

[tasks.interop-preflight]
description = "Check local external interop prerequisites"
run = "zig build external-interop -- preflight"

[tasks.interop-build-image]
description = "Build the quic-zig QNS Docker image"
run = "zig build external-interop -- build-image"
