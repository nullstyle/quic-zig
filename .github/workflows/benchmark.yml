name: benchmark

on:
  schedule:
    # Monday 08:00 UTC. Keep benchmark runs weekly on one stable runner
    # so report history stays comparable.
    - cron: "0 8 * * 1"
  workflow_dispatch:
  # Advisory on-demand PR runs: add the `run-bench` label to a PR.
  pull_request:
    types: [labeled]

jobs:
  bench:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-bench')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Everything here is advisory: numbers inform, they never gate a
    # merge. Hard perf claims come from same-machine A/B recorded in
    # commit messages (see baselines/bench/README.md).
    continue-on-error: true
    steps:
      - name: Checkout quic-zig
        uses: actions/checkout@v7

      - name: Set up mise (pinned project tools)
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Cache Zig packages
        uses: actions/cache@v4
        with:
          path: |
            .zig-global-cache
            zig-pkg
          key: zig-pkg-${{ hashFiles('build.zig.zon') }}
          restore-keys: zig-pkg-

      # GitHub's tarball/raw endpoints flake (504s, DNS) often enough to fail
      # real runs. Prefetch the full dependency tree with retries so a bad
      # window costs seconds, not a red CI run; the cache above makes even
      # that rare.
      - name: Prefetch Zig dependencies (retry on network flake)
        run: |
          for i in 1 2 3 4 5; do
            if zig build --fetch; then exit 0; fi
            echo "fetch attempt $i failed; retrying in $((i * 10))s"
            sleep $((i * 10))
          done
          echo "::error::dependency prefetch failed after 5 attempts"
          exit 1

      - name: Print toolchain
        run: |
          zig version
          uname -a

      - name: Run microbenchmarks
        shell: bash
        env:
          BENCH_MACHINE_ID: github-ubuntu-x64
        run: |
          set -o pipefail
          zig build bench -- --samples 9 --json benchmark-reports/micro.json 2>&1 | tee benchmark-output.txt

      - name: Run e2e benchmarks
        shell: bash
        env:
          BENCH_MACHINE_ID: github-ubuntu-x64
        run: |
          set -o pipefail
          zig build bench-e2e -- --samples 9 --json benchmark-reports/e2e.json 2>&1 | tee -a benchmark-output.txt

      # Advisory regression check against the committed runner-class
      # baseline, when one exists. The markdown lands in the job summary.
      # Refresh policy: baselines/bench/README.md.
      - name: Compare against committed baseline (advisory)
        shell: bash
        run: |
          for pair in "github-ubuntu-x64.json micro.json" "github-ubuntu-x64-e2e.json e2e.json"; do
            set -- $pair
            if [ -f "baselines/bench/$1" ]; then
              zig build bench-compare -- --baseline "baselines/bench/$1" --new "benchmark-reports/$2" --advisory
            else
              echo "### bench-compare: no committed baseline baselines/bench/$1 yet (see baselines/bench/README.md)" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-report-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmark-reports/*.json
            benchmark-output.txt
          if-no-files-found: warn
          retention-days: 90
