name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# quic-zig tracks the project toolchain via mise.toml, so CI uses
# jdx/mise-action to install the same Zig and helper tools as local
# development. boringssl-zig is a URL+hash dep, so Zig fetches it
# itself during build.
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        # Linux (x86-64 + aarch64), macOS 15, and Windows are tier-1 hard
        # gates for 1.0. macOS 26 is advisory while the next hosted image
        # generation settles. See docs/RELEASE_READINESS.md for platform
        # tier policy.
        include:
          - os: ubuntu-latest
            advisory: false
          - os: ubuntu-24.04-arm
            advisory: false
          - os: macos-15
            advisory: false
          - os: windows-latest
            advisory: false
          - os: macos-26
            advisory: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.advisory }}
    # A deadlocked or pathological test must fail fast instead of
    # burning the 6-hour GitHub default job cap.
    timeout-minutes: 45
    # Run every step under bash so the toolchain step's `uname` works on
    # the Windows runner too (Git Bash ships on windows-latest).
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout quic-zig
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise (project tools)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          install: true
          cache: true

      - name: Cache Zig packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .zig-global-cache
            zig-pkg
          key: zig-pkg-${{ hashFiles('build.zig.zon') }}
          restore-keys: zig-pkg-

      # GitHub's tarball/raw endpoints flake (504s, DNS) often enough to fail
      # real runs. Prefetch the full dependency tree with retries so a bad
      # window costs seconds, not a red CI run; the cache above makes even
      # that rare.
      - name: Prefetch Zig dependencies (retry on network flake)
        run: |
          for i in 1 2 3 4 5; do
            if zig build --fetch; then exit 0; fi
            echo "fetch attempt $i failed; retrying in $((i * 10))s"
            sleep $((i * 10))
          done
          echo "::error::dependency prefetch failed after 5 attempts"
          exit 1

      - name: Print toolchain
        run: |
          zig version
          uname -a

      - name: zig build
        run: zig build --summary all

      - name: zig build test
        run: zig build test --summary all

      # The production mode: ReleaseSafe is the only supported
      # internet-facing optimize mode (build.zig enforces it), so the
      # suite must pass under it too — Debug-only gating leaves the
      # runtime-safety-check interplay untested on the merge gate.
      - name: zig build test (ReleaseSafe)
        run: zig build test -Drelease=true --summary all

      # Format gate (excludes the vendored consumer-smoke caches).
      - name: zig fmt --check
        run: zig fmt --check build.zig src tests bench examples tools/bench_compare.zig tools/external_interop.zig tools/consumer-smoke/src tools/consumer-smoke/build.zig

      # The canonical echo pair is wired only into the `examples` step;
      # compile-gate it so the embedder-facing entry points cannot
      # bit-rot.
      - name: zig build examples
        run: zig build examples --summary all

      # End-to-end echo example smoke: server loop on a thread, client
      # loop over real loopback UDP, non-zero exit unless the stream +
      # datagram round-trip happened. Linux-only: it is a real-socket /
      # real-thread harness, and one tier-1 leg is enough signal.
      - name: zig build run-echo-smoke
        if: matrix.os == 'ubuntu-latest'
        run: zig build run-echo-smoke

      # Bulk-upload counterpart: completion-gated, the MB/s line is
      # informational (loopback rate on shared runners is too noisy to
      # assert on).
      - name: zig build run-goodput-smoke
        if: matrix.os == 'ubuntu-latest'
        run: zig build run-goodput-smoke

      # Out-of-tree consumer smoke: builds a separate package that
      # depends on quic-zig by path and pins the exported quic +
      # boringssl module surface (type identity for
      # Client.Config.tls_context_override consumers).
      - name: consumer-smoke (out-of-tree package)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd tools/consumer-smoke
          zig build --summary all
          zig build run

  sanitizer:
    name: sanitizer (sanitize-c=full)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout quic-zig
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise (project tools)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          install: true
          cache: true

      - name: Cache Zig packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .zig-global-cache
            zig-pkg
          key: zig-pkg-${{ hashFiles('build.zig.zon') }}
          restore-keys: zig-pkg-

      # GitHub's tarball/raw endpoints flake (504s, DNS) often enough to fail
      # real runs. Prefetch the full dependency tree with retries so a bad
      # window costs seconds, not a red CI run; the cache above makes even
      # that rare.
      - name: Prefetch Zig dependencies (retry on network flake)
        run: |
          for i in 1 2 3 4 5; do
            if zig build --fetch; then exit 0; fi
            echo "fetch attempt $i failed; retrying in $((i * 10))s"
            sleep $((i * 10))
          done
          echo "::error::dependency prefetch failed after 5 attempts"
          exit 1

      - name: zig build test -Dsanitize-c=full
        run: zig build test -Dsanitize-c=full --summary all
