name: fuzz

on:
  schedule:
    # Sunday 09:00 UTC, just after the interop run.
    - cron: "0 9 * * 0"
  workflow_dispatch:
    inputs:
      iterations:
        description: "Per-target iteration budget (e.g. 100K, 1M)"
        required: false
        default: "1M"

# Coverage-guided fuzzing of the wire / frame / server header-peek
# parsers. The harness lives next to the unit tests in src/wire/,
# src/frame/, and src/Server.zig (every `std.testing.fuzz` site).
# Crashes save to .zig-cache/v/; the artifact upload preserves them
# so we can replay locally.
#
# Budget: 1M per target (~37M executions total, ~5 h measured on the
# pinned toolchain). This is the weekly deep-exploration run; the
# release gate is rc-fuzz.yml at 50000/target. The docs used to claim
# 10M here while the default was 100K — 10M/target would be ~50 h,
# past the 6 h job cap, so it was never runnable; 1M is the largest
# budget that fits.
jobs:
  fuzz:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 350
    env:
      ITERS: ${{ github.event.inputs.iterations || '1M' }}
    steps:
      - name: Checkout quic-zig
        uses: actions/checkout@v7

      - name: Set up mise (zig master + project tools)
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Cache Zig packages
        uses: actions/cache@v4
        with:
          path: |
            .zig-global-cache
            zig-pkg
          key: zig-pkg-${{ hashFiles('build.zig.zon') }}
          restore-keys: zig-pkg-

      # Warm the coverage-guided corpus across weekly runs. `.zig-cache/v`
      # holds the fuzzer's accumulated interesting inputs; without this
      # every run starts cold and re-discovers the same coverage.
      # Keyed on the toolchain pin (a different Zig instruments
      # differently) with a date suffix so the entry rotates weekly
      # rather than growing unbounded; restore-keys falls back to the
      # most recent prior corpus for the same toolchain.
      - name: Restore fuzz corpus
        uses: actions/cache@v4
        with:
          path: .zig-cache/v
          key: fuzz-corpus-${{ hashFiles('mise.toml') }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ hashFiles('mise.toml') }}-

      # GitHub's tarball/raw endpoints flake (504s, DNS) often enough to fail
      # real runs. Prefetch the full dependency tree with retries so a bad
      # window costs seconds, not a red CI run; the cache above makes even
      # that rare.
      - name: Prefetch Zig dependencies (retry on network flake)
        run: |
          for i in 1 2 3 4 5; do
            if zig build --fetch; then exit 0; fi
            echo "fetch attempt $i failed; retrying in $((i * 10))s"
            sleep $((i * 10))
          done
          echo "::error::dependency prefetch failed after 5 attempts"
          exit 1

      - name: zig build test --fuzz
        run: zig build test -Duse-llvm=true --fuzz=$ITERS

      - name: Upload corpus + crashes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-cache-${{ github.run_id }}
          path: .zig-cache/v
          if-no-files-found: ignore
          retention-days: 30
