name: fuzz

on:
  schedule:
    # Sunday 09:00 UTC, just after the interop run.
    - cron: "0 9 * * 0"
  workflow_dispatch:
    inputs:
      iterations:
        description: "Per-site iteration budget (e.g. 100K, 1M)"
        required: false
        default: "1M"

# Coverage-guided fuzzing of every `std.testing.fuzz` site in src/ (the
# harnesses live next to the unit tests). The fuzzer keeps its corpus
# and any failing input under .zig-cache/f/ and its coverage file under
# .zig-cache/v/; the artifact upload preserves both so a finding can be
# replayed locally.
#
# Budget: 1M per site. This is the weekly deep-exploration run; the
# release gate is rc-fuzz.yml at 50000/site. The docs used to claim
# 10M here while the default was 100K — 10M/site would be ~50 h, past
# the 6 h job cap, so it was never runnable; 1M is the largest budget
# that fits.
#
# Advisory means nothing gates on this job, not that its result may be
# hidden. It used to carry `continue-on-error: true`, which reported a
# failed fuzz step as a successful run — and `zig build test --fuzz`
# exits 0 on a failing site anyway — so seven consecutive weekly runs
# logged the same failing site and showed green. tools/fuzz-gate.sh
# reads the log and the coverage header instead of the exit status, and
# a failure here is now a red run.
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ITERS: ${{ github.event.inputs.iterations || '1M' }}
    steps:
      - name: Checkout quic-zig
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise (project tools)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          install: true
          cache: true

      - name: Cache Zig packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .zig-global-cache
            zig-pkg
          key: zig-pkg-${{ hashFiles('build.zig.zon') }}
          restore-keys: zig-pkg-

      # Warm the coverage-guided corpus across weekly runs. `.zig-cache/f`
      # holds the fuzzer's accumulated interesting inputs, one directory
      # per site; without this every run starts cold and re-discovers the
      # same coverage. (This cached `.zig-cache/v` until 2026-10, which is
      # the coverage file, not the corpus — so every run did start cold.)
      # Keyed on the toolchain pin (a different Zig instruments
      # differently) with a run-id suffix so the entry rotates weekly
      # rather than growing unbounded; restore-keys falls back to the
      # most recent prior corpus for the same toolchain.
      - name: Restore fuzz corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache/f
          key: fuzz-corpus-f-${{ hashFiles('mise.toml') }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-f-${{ hashFiles('mise.toml') }}-

      # GitHub's tarball/raw endpoints flake (504s, DNS) often enough to fail
      # real runs. Prefetch the full dependency tree with retries so a bad
      # window costs seconds, not a red CI run; the cache above makes even
      # that rare.
      - name: Prefetch Zig dependencies (retry on network flake)
        run: |
          for i in 1 2 3 4 5; do
            if zig build --fetch; then exit 0; fi
            echo "fetch attempt $i failed; retrying in $((i * 10))s"
            sleep $((i * 10))
          done
          echo "::error::dependency prefetch failed after 5 attempts"
          exit 1

      # Fails on a failing site, on a run that stopped early, and on a run
      # with no coverage instrumentation — none of which the exit status
      # of `zig build test --fuzz` reports.
      - name: zig build test --fuzz (via tools/fuzz-gate.sh)
        run: tools/fuzz-gate.sh "$ITERS" fuzz.log

      - name: Upload corpus, failing input, coverage, and log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-cache-${{ github.run_id }}
          path: |
            .zig-cache/f
            .zig-cache/v
            fuzz.log
          if-no-files-found: ignore
          retention-days: 30
