name: interop

on:
  schedule:
    # Sunday 06:00 UTC. Interop is environment-sensitive and slow,
    # so we run it weekly rather than on every push.
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      tests:
        description: "QNS test letters (comma-separated)"
        required: false
        default: "H,D,C,M,L2,B,G"
      clients:
        description: "Client matrix"
        required: false
        default: "quic-go,quiche,ngtcp2"

# Interop runs are advisory: a regression here is a signal to
# investigate, not a merge gate (test.yml and quic-go-interop.yml are
# the gates). Advisory does not mean hidden. This job used to carry
# `continue-on-error: true`, and every run from at least 2026-07-26 to
# 2026-10-03 ran ZERO tests and still showed green. The cause is the
# one recorded in quic-go-interop.yml: the pinned runner's compose file
# needs Docker Engine 28.1 or later, GitHub's ubuntu image carries
# 28.0.4, no container started, and the runner reported that as
# "quic-zig server not compliant" and skipped every client.
#
# The job now installs a newer Engine, and a failed matrix step is a
# red run. The wrapper reads the result file after the run: a skipped
# pair, a failed test, or a failed measurement fails the step. Read the
# `interop evidence:` line in the log, not the run conclusion.
jobs:
  qns-server:
    name: QNS interop (quic-zig as server)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      QUIC_INTEROP_RUNNER_REF: 1d6f6554ac8e3b7c4cca0e3d40fd69f661420673
      QUIC_GO_IMAGE: martenseemann/quic-go-interop@sha256:37db4402341f81981ffba01a6fa532d378f165a6fa8dd2b902f33549383d0077
      QUIC_ZIG_IMAGE: quic-zig-qns:local
      # H,D,C,M = handshake/transfer/chacha20/multiplexing pass-fail
      # cells; L2/B = transferloss/blackhole (loss-conditioned cells
      # guarding the CC/pacing/batching behavior); G = the goodput
      # MEASUREMENT cell — the runner reports Mbps per implementation
      # pair in result.json, summarized below.
      TESTS: ${{ github.event.inputs.tests || 'H,D,C,M,L2,B,G' }}
      CLIENTS: ${{ github.event.inputs.clients || 'quic-go,quiche,ngtcp2' }}
      # Cells that fail for a known reason (`peer:test`). A listed cell
      # that fails does not fail the job. A listed cell that passes
      # does, with a message to take it off this list, so the list
      # cannot go stale; a cell that is not in a given run is ignored.
      #
      # quiche:multiplexing — quiche's test client cuts a request short
      # when its send window is full and never finishes it. It does
      # that against other servers too (quic-go 4 of 8 runs, ngtcp2 2
      # of 8, no quic-zig in the pair); against quic-zig it fails
      # every time (8 of 8, and against server images back to
      # 2026-05-11). A server only changes the odds, so this cell is
      # not a pass/fail signal for quic-zig. It can stay on this list
      # only while it fails every time; when that stops, it needs a
      # "flaky" class, not this one. Measured 2026-10-03; the detail
      # is above `stalled_peer_keepalive_idle_us` in
      # interop/qns_endpoint.zig.
      KNOWN_FAILURES: quiche:multiplexing
    steps:
      - name: Checkout quic-zig
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: quic-zig

      - name: Checkout quic-interop-runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: quic-interop/quic-interop-runner
          ref: ${{ env.QUIC_INTEROP_RUNNER_REF }}
          path: quic-interop-runner

      - name: Set up mise (project tools)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          install: true
          cache: true
          working_directory: quic-zig

      - name: Cache Zig packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            quic-zig/.zig-global-cache
            quic-zig/zig-pkg
          key: zig-pkg-${{ hashFiles('quic-zig/build.zig.zon') }}
          restore-keys: zig-pkg-

      # GitHub's tarball/raw endpoints flake (504s, DNS) often enough to fail
      # real runs. Prefetch the full dependency tree with retries so a bad
      # window costs seconds, not a red CI run; the cache above makes even
      # that rare.
      - name: Prefetch Zig dependencies (retry on network flake)
        working-directory: quic-zig
        run: |
          for i in 1 2 3 4 5; do
            if zig build --fetch; then exit 0; fi
            echo "fetch attempt $i failed; retrying in $((i * 10))s"
            sleep $((i * 10))
          done
          echo "::error::dependency prefetch failed after 5 attempts"
          exit 1

      - name: Install runner deps
        working-directory: quic-interop-runner
        run: pip install -r requirements.txt

      # The runner's compose file needs Engine >= 28.1 (`interface_name`);
      # the ubuntu image carries 28.0.4. See quic-go-interop.yml.
      - name: Set up Docker Engine
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          version: v29.8.2

      # As the runner's own workflow does: its simulator filters IPv6.
      - name: Load the IPv6 filter module for the network simulator
        run: sudo modprobe ip6table_filter

      # A host tshark (Wireshark 4.5 or later), not the wrapper's Docker
      # fallback. See quic-go-interop.yml.
      - name: Install tshark
        run: |
          sudo add-apt-repository -y ppa:wireshark-dev/stable
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tshark
          v=$(dpkg-query -W -f='${Version}' tshark)
          echo "tshark package version: $v"
          if ! dpkg --compare-versions "$v" ge 4.5.0; then
            echo "::error::tshark $v is older than the 4.5.0 the runner needs"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build QNS image from quic-zig
        working-directory: quic-zig
        run: |
          zig build external-interop -- build-image --image "${QUIC_ZIG_IMAGE}"

      # No `--assume-compliant`: the runner's preflight runs for every
      # implementation. A failed preflight skips the pair and the runner
      # still exits 0, so the wrapper reads the result file and fails
      # the step on any skipped cell.
      # The runner owns and recreates the log directory, so the JSON
      # result lives outside it.
      - name: Run QNS interop (server role)
        working-directory: quic-zig
        env:
          RUNNER_DIR: ${{ github.workspace }}/quic-interop-runner
        run: |
          zig build external-interop -- runner \
            --role server \
            --runner-dir "${RUNNER_DIR}" \
            --image "${QUIC_ZIG_IMAGE}" \
            --clients "${CLIENTS}" \
            --tests "${TESTS}" \
            --quic-go-image "${QUIC_GO_IMAGE}" \
            --known-failures "${KNOWN_FAILURES}" \
            --log-dir "${{ github.workspace }}/interop-logs/matrix" \
            --json "${{ github.workspace }}/interop-results/matrix.json"

      # Surface the pass/fail matrix and the goodput measurements in
      # the job summary so nobody has to download artifacts to see the
      # numbers. result.json shape: quic-interop-runner's schema —
      # "results"/"measurements" are lists (one per client) of lists of
      # {abbr/result} / {abbr, result, details} cells.
      - name: Summarize results
        if: always()
        run: |
          RESULT="${{ github.workspace }}/interop-results/matrix.json"
          if [ ! -f "$RESULT" ]; then
            echo "### interop: no result file produced — the matrix did not run" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### interop matrix (quic-zig as server)"
            echo ""
            jq -r '
              (.clients // []) as $clients
              | "| client | tests | measurements |",
                "|---|---|---|",
                (range($clients | length) as $i
                 | "| \($clients[$i]) | \(
                      [.results[$i][]? | "\(.abbr):\(.result)"] | join(" ")
                    ) | \(
                      [.measurements[$i][]? | "\(.abbr):\(.result) \(.details // "")"] | join(" ")
                    ) |")
            ' "$RESULT"
          } >> "$GITHUB_STEP_SUMMARY" ||             echo "(result.json did not match the expected schema)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload interop logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: interop-logs-${{ github.run_id }}
          path: |
            interop-logs/**
            interop-results/**
          if-no-files-found: warn
          retention-days: 14
