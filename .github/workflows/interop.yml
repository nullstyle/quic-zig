name: interop

on:
  schedule:
    # Sunday 06:00 UTC. Interop is environment-sensitive and slow,
    # so we run it weekly rather than on every push.
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      tests:
        description: "QNS test letters (comma-separated)"
        required: false
        default: "H,D,C,M,L2,B,G"
      clients:
        description: "Client matrix"
        required: false
        default: "quic-go,quiche,ngtcp2"

# Interop runs are intentionally tolerant: a regression here is a
# signal to investigate, not a hard merge gate. The test workflow
# (test.yml) is the actual CI gate.
jobs:
  qns-server:
    name: QNS interop (quic-zig as server)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    env:
      QUIC_INTEROP_RUNNER_REF: 1d6f6554ac8e3b7c4cca0e3d40fd69f661420673
      QUIC_GO_IMAGE: martenseemann/quic-go-interop@sha256:37db4402341f81981ffba01a6fa532d378f165a6fa8dd2b902f33549383d0077
      QUIC_ZIG_IMAGE: quic-zig-qns:local
      # H,D,C,M = handshake/transfer/chacha20/multiplexing pass-fail
      # cells; L2/B = transferloss/blackhole (loss-conditioned cells
      # guarding the CC/pacing/batching behavior); G = the goodput
      # MEASUREMENT cell — the runner reports Mbps per implementation
      # pair in result.json, summarized below.
      TESTS: ${{ github.event.inputs.tests || 'H,D,C,M,L2,B,G' }}
      CLIENTS: ${{ github.event.inputs.clients || 'quic-go,quiche,ngtcp2' }}
    steps:
      - name: Checkout quic-zig
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: quic-zig

      - name: Checkout quic-interop-runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: quic-interop/quic-interop-runner
          ref: ${{ env.QUIC_INTEROP_RUNNER_REF }}
          path: quic-interop-runner

      - name: Set up mise (project tools)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          install: true
          cache: true
          working_directory: quic-zig

      - name: Cache Zig packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            quic-zig/.zig-global-cache
            quic-zig/zig-pkg
          key: zig-pkg-${{ hashFiles('quic-zig/build.zig.zon') }}
          restore-keys: zig-pkg-

      # GitHub's tarball/raw endpoints flake (504s, DNS) often enough to fail
      # real runs. Prefetch the full dependency tree with retries so a bad
      # window costs seconds, not a red CI run; the cache above makes even
      # that rare.
      - name: Prefetch Zig dependencies (retry on network flake)
        working-directory: quic-zig
        run: |
          for i in 1 2 3 4 5; do
            if zig build --fetch; then exit 0; fi
            echo "fetch attempt $i failed; retrying in $((i * 10))s"
            sleep $((i * 10))
          done
          echo "::error::dependency prefetch failed after 5 attempts"
          exit 1

      - name: Install runner deps
        working-directory: quic-interop-runner
        run: pip install -r requirements.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build QNS image from quic-zig
        working-directory: quic-zig
        run: |
          zig build external-interop -- build-image --image "${QUIC_ZIG_IMAGE}"

      - name: Run QNS interop (server role)
        working-directory: quic-zig
        env:
          RUNNER_DIR: ${{ github.workspace }}/quic-interop-runner
        run: |
          zig build external-interop -- runner \
            --role server \
            --runner-dir "${RUNNER_DIR}" \
            --image "${QUIC_ZIG_IMAGE}" \
            --clients "${CLIENTS}" \
            --tests "${TESTS}" \
            --quic-go-image "${QUIC_GO_IMAGE}" \
            --log-dir "${{ github.workspace }}/interop-logs" \
            --json "${{ github.workspace }}/interop-logs/result.json"

      # Surface the pass/fail matrix and the goodput measurements in
      # the job summary so nobody has to download artifacts to see the
      # numbers. result.json shape: quic-interop-runner's schema —
      # "results"/"measurements" are lists (one per client) of lists of
      # {abbr/result} / {abbr, result, details} cells.
      - name: Summarize results
        if: always()
        run: |
          RESULT="${{ github.workspace }}/interop-logs/result.json"
          if [ ! -f "$RESULT" ]; then
            echo "### interop: no result.json produced" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### interop matrix (quic-zig as server)"
            echo ""
            jq -r '
              (.clients // []) as $clients
              | "| client | tests | measurements |",
                "|---|---|---|",
                (range($clients | length) as $i
                 | "| \($clients[$i]) | \(
                      [.results[$i][]? | "\(.abbr):\(.result)"] | join(" ")
                    ) | \(
                      [.measurements[$i][]? | "\(.abbr):\(.result) \(.details // "")"] | join(" ")
                    ) |")
            ' "$RESULT"
          } >> "$GITHUB_STEP_SUMMARY" ||             echo "(result.json did not match the expected schema)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload interop logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: interop-logs-${{ github.run_id }}
          path: |
            interop-logs/**
          if-no-files-found: warn
          retention-days: 14
