name: pin-lint

# Cross-repo dependency-pin lint (docs/RELEASE_READINESS.md, "Cross-repo
# hygiene"). quic-zig and http3-zig must agree on the boringssl pin
# byte-for-byte, or `boringssl.tls.Context` type identity breaks for
# embedders composing both packages.
#
# The lint is a RATCHET: identical pins pass; the one dated, known
# divergence below passes with a warning; any other combination fails.
# The extractor still recognizes the old `.boringssl_zig` key so a
# one-sided back-pin fails loudly instead of as an unparseable
# manifest.
#
# Known divergence (2026-10-03): quic-zig has pinned boringssl 0.6.7
# since v0.21.2 (2026-09-21; crypto.pkey / x509 / pem for consumers
# that mint development PKIs), while http3-zig's main still pins 0.6.6
# beside quic v0.19.0. The lint compares this repo's manifest with
# http3-zig's main, so it has been red since that release, and a lint
# that is always red reports nothing. When http3-zig moves to a quic
# release that carries 0.6.7 (v0.21.2 or later) and repins, delete the
# known pair so the lint enforces strict identity again, and re-check
# the RELEASE_READINESS box.
#
# The `zig-pin` job is the in-repo half: the Zig toolchain is named in
# four places (mise.toml lists them) and they must agree, including the
# QNS Dockerfile's per-arch digests against what ziglang.org publishes.
on:
  push:
    branches: [main]
    paths:
      - build.zig.zon
      - mise.toml
      - tools/consumer-smoke/build.zig.zon
      - interop/qns/Dockerfile
      - tools/check-zig-pins.sh
      - .github/workflows/pin-lint.yml
  pull_request:
    branches: [main]
    paths:
      - build.zig.zon
      - mise.toml
      - tools/consumer-smoke/build.zig.zon
      - interop/qns/Dockerfile
      - tools/check-zig-pins.sh
      - .github/workflows/pin-lint.yml
  schedule:
    # Weekly Monday sweep: catches drift introduced on the http3-zig side,
    # which no push to this repo would otherwise re-lint.
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  zig-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout quic-zig
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Zig toolchain pins agree (four sites + published digests)
        run: sh tools/check-zig-pins.sh --online

  boringssl-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout quic-zig
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compare boringssl pins with http3-zig
        run: |
          set -eu

          extract_hash() {
              awk '
                  index($0, ".boringssl = .{") || index($0, ".boringssl_zig = .{") { in_dep = 1; next }
                  in_dep && index($0, ".hash = ") {
                      line = $0
                      sub(/^[^"]*"/, "", line)
                      sub(/".*$/, "", line)
                      print line
                      found = 1
                      exit
                  }
                  END { if (!found) exit 1 }
              ' "$1"
          }

          ours=$(extract_hash build.zig.zon) || {
              echo "FAIL: could not extract .boringssl .hash from build.zig.zon" >&2
              exit 1
          }

          curl -fsSL --retry 3 -o http3-build.zig.zon \
              https://raw.githubusercontent.com/nullstyle/http3-zig/main/build.zig.zon
          theirs=$(extract_hash http3-build.zig.zon) || {
              echo "FAIL: could not extract .boringssl .hash from http3-zig build.zig.zon" >&2
              exit 1
          }

          # The one tolerated divergence (see the header comment): quic-zig
          # on boringssl 0.6.7, http3-zig still on 0.6.6. Delete this pair
          # once http3-zig repins.
          known_ours="boringssl-0.6.7-Vv5DN8RMAgDGST3F3NpoMjez8Z_J60megIom9Ru9XqD2"
          known_theirs="boringssl-0.6.6-Vv5DNx8KAgCi6qYllvBlOXf0DwfFhk8OJ_sY5HGR7Kqh"

          if [ "$ours" = "$theirs" ]; then
              {
                  echo "### pin-lint: OK"
                  echo ""
                  echo "boringssl pins are byte-for-byte identical:"
                  echo ""
                  echo '`'"$ours"'`'
              } | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$ours" = "$known_ours" ] && [ "$theirs" = "$known_theirs" ]; then
              {
                  echo "### pin-lint: WARNING (known divergence tolerated)"
                  echo ""
                  echo "- quic-zig: \`$ours\`"
                  echo "- http3-zig: \`$theirs\` (has not moved to a quic release that carries 0.6.7)"
                  echo ""
                  echo "Reconverge when http3-zig repins, then delete the known pair"
                  echo "in pin-lint.yml to restore strict identity."
              } | tee -a "$GITHUB_STEP_SUMMARY"
          else
              {
                  echo "### pin-lint: FAIL (pins drifted beyond the known pair)"
                  echo ""
                  echo "- quic-zig: \`$ours\`"
                  echo "- http3-zig: \`$theirs\`"
                  echo ""
                  echo "Either repin both repos identically — \`boringssl.tls.Context\`"
                  echo "type identity across the quic/http3 boundary depends on the"
                  echo "dedupe — or, for a deliberate temporary divergence, update the"
                  echo "known pair in pin-lint.yml with a dated justification."
              } | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
          fi
