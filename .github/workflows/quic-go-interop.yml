name: quic-go-interop

# A hard gate: quic-zig as a client must complete a handshake and a
# transfer against a pinned quic-go server.
#
# From its first run on 2026-07-05 to 2026-10-03 this gate ran ZERO
# tests. Of 111 runs, 96 reached the runner; each of those skipped its
# only pair, and 93 showed green. The pinned runner's
# docker-compose.yml uses `interface_name`, which needs Docker Engine
# 28.1 or later; GitHub's ubuntu image carries 28.0.4, so no container
# ever started. The runner's compliance preflight read that as
# "quic-zig client not compliant", skipped the pair, and exited 0.
# Every release tagged in that window, 0.23.0 included, counted this
# gate as passed.
#
# Three things stop a repeat. This workflow installs a newer Engine, as
# the runner's own workflow does. The wrapper refuses to start on an
# Engine that is too old. And the wrapper reads the result file after
# the run: a skipped or missing cell fails the step (`interop evidence`
# in the log is the line to read; the run conclusion is not evidence).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  QUIC_INTEROP_RUNNER_REF: 1d6f6554ac8e3b7c4cca0e3d40fd69f661420673
  # linux/amd64 manifest for martenseemann/quic-go-interop:latest,
  # resolved 2026-07-05. Keep this immutable until intentionally
  # refreshing the hard 1.0 interop gate.
  QUIC_GO_IMAGE: martenseemann/quic-go-interop@sha256:37db4402341f81981ffba01a6fa532d378f165a6fa8dd2b902f33549383d0077
  QUIC_ZIG_IMAGE: quic-zig-qns:hard-gate

jobs:
  qns-client-quic-go:
    name: QNS client vs pinned quic-go
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout quic-zig
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: quic-zig

      - name: Checkout pinned quic-interop-runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: quic-interop/quic-interop-runner
          ref: ${{ env.QUIC_INTEROP_RUNNER_REF }}
          path: quic-interop-runner

      - name: Set up mise (project tools)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          install: true
          cache: true
          working_directory: quic-zig

      - name: Cache Zig packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            quic-zig/.zig-global-cache
            quic-zig/zig-pkg
          key: zig-pkg-${{ hashFiles('quic-zig/build.zig.zon') }}
          restore-keys: zig-pkg-

      # GitHub's tarball/raw endpoints flake (504s, DNS) often enough to fail
      # real runs. Prefetch the full dependency tree with retries so a bad
      # window costs seconds, not a red CI run; the cache above makes even
      # that rare.
      - name: Prefetch Zig dependencies (retry on network flake)
        working-directory: quic-zig
        run: |
          for i in 1 2 3 4 5; do
            if zig build --fetch; then exit 0; fi
            echo "fetch attempt $i failed; retrying in $((i * 10))s"
            sleep $((i * 10))
          done
          echo "::error::dependency prefetch failed after 5 attempts"
          exit 1

      # The runner's compose file needs Engine >= 28.1 (`interface_name`);
      # the ubuntu image carries 28.0.4. The runner's own workflow
      # installs a newer Engine the same way. Drop this step when the
      # image's own Engine is new enough (the wrapper checks, and says
      # so when it is not).
      - name: Set up Docker Engine
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          version: v29.8.2

      # As the runner's own workflow does: its simulator filters IPv6.
      - name: Load the IPv6 filter module for the network simulator
        run: sudo modprobe ip6table_filter

      # The runner reads its packet captures with tshark and needs
      # Wireshark 4.5 or later; Ubuntu's own package is older, so this
      # is the Wireshark team's PPA, as in the runner's own workflow.
      # Without a host tshark the wrapper falls back to tshark in a
      # Docker image. On Linux, pyshark then loses track of the
      # `docker run` process and stops the whole runner with "TShark
      # seems to have crashed" (the first real matrix run, 2026-10-03).
      - name: Install tshark
        run: |
          sudo add-apt-repository -y ppa:wireshark-dev/stable
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tshark
          v=$(dpkg-query -W -f='${Version}' tshark)
          echo "tshark package version: $v"
          if ! dpkg --compare-versions "$v" ge 4.5.0; then
            echo "::error::tshark $v is older than the 4.5.0 the runner needs"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # No `--assume-compliant`: the preflight runs for both sides. It
      # was skipped for quic-go from 0.7.3 on, because it "failed in CI";
      # the failure was the Engine, not the preflight.
      # `--strict`: both cells must be `succeeded`. Read the
      # `interop evidence:` line in the log, not the run conclusion.
      - name: Run quic-go hard interop gate
        working-directory: quic-zig
        env:
          RUNNER_DIR: ${{ github.workspace }}/quic-interop-runner
        run: |
          zig build external-interop -- runner \
            --role client \
            --build-image \
            --runner-dir "${RUNNER_DIR}" \
            --image "${QUIC_ZIG_IMAGE}" \
            --servers quic-go \
            --tests H,D \
            --quic-go-image "${QUIC_GO_IMAGE}" \
            --strict \
            --log-dir "${{ github.workspace }}/interop-logs/quic-go-hard" \
            --json "${{ github.workspace }}/interop-results/quic-go-hard.json"

      - name: Upload interop logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quic-go-hard-interop-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/interop-logs/**
            ${{ github.workspace }}/interop-results/**
          if-no-files-found: warn
          retention-days: 14
