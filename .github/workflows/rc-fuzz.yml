name: rc-fuzz

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: "Per-site coverage-guided fuzz budget (total execs = sites x this; the gate counts the sites). Plain integers and the K / M suffixes parse."
        required: false
        default: "50000"

# Manual pre-release gate. Blocking: it must be green on the release commit
# before tagging. The scheduled `fuzz.yml` job (1M/site budget, weekly)
# remains advisory and is what carries deep bug-hunting coverage.
#
# The budget is 50000 per site (~2M executions across 40 sites) rather than
# the 1M it used to be, because the long run measurably buys almost nothing:
# measured on 0.17.0-dev.1252, coverage was 8.81% at 39k executions and
# 9.48% at 37.1M — 0.67 percentage points for ~950x the work — with unique
# runs plateauing around 12.5k. A 5-hour blocking gate priced a release at
# half a day and bought under a point of coverage, so releases stopped
# getting tagged at all, which is strictly worse for security than a short
# gate that actually runs.
#
# What this gate is FOR: prove the fuzz harness is real on this commit and
# catch a failing site or a corpus regression before a tag. Deep
# exploration is the weekly job's job.
#
# It has failed at that twice, both times by trusting the exit status of
# `zig build test --fuzz`. First a run with no coverage instrumentation
# "passed" for two weeks. Then, from v0.14.0 through v0.21.1, all eight
# gate runs logged a failing site, stopped at a fraction of their budget
# (as little as 18,503 of ~2M executions), and still exited 0 — a
# non-zero coverage header was all the old check asked for. tools/fuzz-gate.sh now
# fails on the failing-site log line, on a run count below 90% of
# sites x budget, and on a missing or uninstrumented coverage file; it
# prints the coverage numbers either way.
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ITERS: ${{ github.event.inputs.iterations || '50000' }}
    steps:
      - name: Checkout quic-zig
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise (project tools)
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v4
        with:
          install: true
          cache: true

      - name: Cache Zig packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .zig-global-cache
            zig-pkg
          key: zig-pkg-${{ hashFiles('build.zig.zon') }}
          restore-keys: zig-pkg-

      # GitHub's tarball/raw endpoints flake (504s, DNS) often enough to fail
      # real runs. Prefetch the full dependency tree with retries so a bad
      # window costs seconds, not a red CI run; the cache above makes even
      # that rare.
      - name: Prefetch Zig dependencies (retry on network flake)
        run: |
          for i in 1 2 3 4 5; do
            if zig build --fetch; then exit 0; fi
            echo "fetch attempt $i failed; retrying in $((i * 10))s"
            sleep $((i * 10))
          done
          echo "::error::dependency prefetch failed after 5 attempts"
          exit 1

      # Exit status alone is NOT evidence the gate did anything (see the
      # header). The script runs the fuzzer, retries once on the coverage
      # metadata flake, then judges the run on its log and on the coverage
      # file's own header, and prints the coverage numbers even on failure
      # — a failed run is when you most need to know whether pcs_len was
      # zero and how far the run got.
      - name: zig build test --fuzz (via tools/fuzz-gate.sh)
        shell: bash
        run: |
          rm -rf .zig-cache/f
          tools/fuzz-gate.sh "$ITERS" rc-fuzz.log

      # .zig-cache/f holds the corpus and, on a failure, the failing input
      # (`crash`, and the instance input file `in0` it was copied from).
      - name: Upload corpus, failing input, coverage, and log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rc-fuzz-cache-${{ github.run_id }}
          path: |
            .zig-cache/f
            .zig-cache/v
            rc-fuzz.log
          if-no-files-found: ignore
          retention-days: 30
